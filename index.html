<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title></title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        input {
            padding: 10px;
            font-size: 18px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
    </div>

    <script>
        async function checkPassword() {

            const password = document.getElementById("password").value;

            const response = await fetch("/api/check-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    password: password
                })
            });

            const result = await response.json();

            if (result.success) {
                document.body.innerHTML = result.coordinates;
            } else {
                alert("Неверный пароль");
            }
        }
    </script>

</body>
</html>
